server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://bagelb0y-c6gfhyfsheebdzdm.canadacentral-01.azurewebsites.net;
        proxy_set_header Host bagelb0y-c6gfhyfsheebdzdm.canadacentral-01.azurewebsites.net;
        proxy_ssl_server_name on;
        client_max_body_size 25m;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
